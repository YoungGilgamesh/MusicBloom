name: Deploy GitHub Pages

on:
  push:
    branches: [laptop_test_cursor, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# New group so a stuck older "pages" run cannot keep this deploy queued.
concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: threeJs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: threeJs/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /MusicBloom/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: threeJs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
